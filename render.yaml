services:
  - type: web
    name: delivery-hub-backend
    runtime: python
    buildCommand: bash build.sh
    startCommand: gunicorn delivery_hub.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: USE_CELERY
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: delivery-hub-db
          property: connectionString
      - key: FRONTEND_URL
        value: ""
    healthCheckPath: /api/health/

databases:
  - name: delivery-hub-db
    region: oregon
    plan: free
